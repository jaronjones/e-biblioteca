services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebiblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-ebiblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebiblioteca}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebiblioteca} -d ${POSTGRES_DB:-ebiblioteca}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ebiblioteca}:${POSTGRES_PASSWORD:-ebiblioteca}@db:5432/${POSTGRES_DB:-ebiblioteca}?sslmode=disable
      DATA_DIR: /data
      BOOKS_DIR: /books
      BOOKDROP_DIR: /bookdrop
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./data:/data
      - ./books:/books
      - ./bookdrop:/bookdrop
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
