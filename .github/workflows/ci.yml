name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go fmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o bin/e-biblioteca ./cmd/server

      - name: Vendored assets present
        run: |
          test -s web/static/js/vendor/htmx.min.js
          test -s web/static/js/vendor/jszip.min.js
          test -s web/static/js/vendor/epub.min.js
          # Templates must not pull third-party CDNs (air-gapped install).
          if grep -RE 'unpkg\.com|cdnjs\.cloudflare|cdn\.jsdelivr' components/ --include='*.templ'; then
            echo "CDN references still present in templates"
            exit 1
          fi
